<ion-app>
    <ion-router-outlet></ion-router-outlet>

    <div class="custom-tabs">
        <ion-tabs>

            <ion-tab-bar slot="bottom">
                <ion-tab-button (click)="tabNavegation('HomePage')">
                    <ion-icon name="home-outline"></ion-icon>
                    Home
                </ion-tab-button>
                <ion-tab-button tab="new-payment" (click)="tabNavegation('NewPaymentPage')">
                    <ion-icon name="add-circle-outline"></ion-icon>
                    Nuevo
                </ion-tab-button>
                <ion-tab-button tab="add-payment" (click)="tabNavegation('AddPaymentPage')">
                    <ion-icon name="clipboard-outline"></ion-icon>
                    Recurrentes
                </ion-tab-button>
                <ion-tab-button tab="gestiones" (click)="tabNavegation('MenuGestionesPage')">
                    <ion-icon name="file-tray-stacked-outline"></ion-icon>
                    Gestiones
                </ion-tab-button>
            </ion-tab-bar>

        </ion-tabs>
    </div>
</ion-app>
