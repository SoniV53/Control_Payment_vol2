<div class="category-block" *ngIf="grupo" [class.is-collapsed]="isCollapsed">
  <!-- Block Header -->
  <div class="block-header" (click)="toggleCollapse()">
    <div class="title-wrap">
      <ion-icon [src]="getIcon(grupo.categoria.icono || 'pricetag')"></ion-icon>
      <h2>{{ grupo.categoria.nombre | titlecase }}</h2>
      <span class="count-badge">{{ grupo.totalCantidad }}</span>
    </div>
    <div class="header-right">
      <span class="total-text">GTQ {{ grupo.totalMonto | number:'1.2-2' }}</span>
      <ion-icon class="collapse-icon" [src]="getIcon(isCollapsed ? 'chevron-down-outline' : 'chevron-up-outline')"></ion-icon>
    </div>
  </div>

  <!-- Unified Card -->
  <div class="block-card" *ngIf="!isCollapsed">
    <div class="sub-item" *ngFor="let item of grupo.recurrentes; let last = last" [class.no-border]="last" (click)="onEdit(item)">
      
      <!-- Main Data Row -->
      <div class="sub-item-main">
        
        <!-- Toggle on the left -->
        <div class="toggle-box" (click)="$event.stopPropagation()">
           <ion-toggle mode="ios" [checked]="item.activo === 1" (ionChange)="onToggle(item, $event)"></ion-toggle>
        </div>
        
        <div class="text-data">
          <h4 [class.dimmed]="item.activo === 0">{{ item.titulo }}</h4>
          <p>{{ item.fechaInicio | date:'MMM yyyy' }}</p>
        </div>

        <div class="amount-data">
          <h4 [class.dimmed]="item.activo === 0">GTQ {{ item.monto | number:'1.2-2' }}</h4>
          <span class="status-dot" [class.active]="item.activo === 1">
            {{ item.activo === 1 ? 'Activo' : 'Pausado' }}
          </span>
        </div>

        <!-- Arrow icon for edit action -->
        <div class="arrow-box">
          <ion-icon [src]="getIcon('chevron-forward-outline')"></ion-icon>
        </div>
      </div>
    </div>
  </div>
</div>
