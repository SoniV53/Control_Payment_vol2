<div class="recurrente-card">
  <div class="card-header">
    <div class="status-indicator" [class.inactive]="isCheck"></div>
    <span class="header-title">Detalle Recurrente</span>
    <ion-button fill="clear" class="btn-edit" (click)="clickEditItem()">
      <ion-icon [src]="getIcon('create-outline')"></ion-icon>
    </ion-button>
  </div>

  <div class="details-grid">
    <div class="detail-item">
      <span class="label">Fecha</span>
      <span class="value">{{formatearDate()}}</span>
    </div>

    <div class="detail-item">
      <span class="label">Monto</span>
      <span class="value highlight">{{formatearMonto()}}</span>
    </div>

    <div class="detail-item">
      <span class="label">Cantidad</span>
      <span class="value">({{gastoData?.cantidad || 0}})</span>
    </div>
  </div>

  <div class="divider"></div>

  <div class="toggle-section">
    <ion-label>Deshabilitar cargo automático</ion-label>
    <ion-toggle aria-label="Deshabilitar" mode="ios" (ionChange)="ionChangeToggle($event)" [checked]="isCheck"></ion-toggle>
  </div>
</div>
