<label [for]="name">{{label}} <span *ngIf="required">*</span></label>
<div class="content-input">

    <ion-input [required]="required" [type]="type" fill="outline" [placeholder]="placeholder" [value]="value" (ionBlur)="onBlurInput(value)" (ionInput)="onInput($event)" [name]="name" [readonly]="readonly"></ion-input>
</div>
