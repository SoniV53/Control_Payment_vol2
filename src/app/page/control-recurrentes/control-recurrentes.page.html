<ion-header class="ion-no-border">
  <ion-toolbar>
    <app-banner-top [toolBarData]="toolBar" [loader]="loaderNav"></app-banner-top>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  
  <!-- Empty State -->
  <app-empty-state 
    *ngIf="grupos.length === 0"
    icon="folder-open-outline"
    title="No tienes gastos recurrentes"
    subtitle="Tus suscripciones y pagos fijos aparecerán aquí.">
  </app-empty-state>

  <!-- Category Blocks -->
  <app-recurrentes-block 
    *ngFor="let grupo of grupos"
    [grupo]="grupo"
    (toggleActivo)="toggleDeshabilitar($event.item, $event.event)"
    (editarRecurrente)="editarRecurrente($event)">
  </app-recurrentes-block>

  <app-modal-editar-recurrente 
    [isOpen]="isModalOpen" 
    [editData]="editData" 
    [gastosHistoricos]="gastosHistoricos"
    (closeModal)="isModalOpen = false"
    (save)="guardarEdicion()"
    (toggleAll)="toggleAllHistorial($event)"
    (editarGasto)="editarGastoHistorico($event)"
    (eliminarGasto)="eliminarGastoHistorico($event)"
    (restablecerGasto)="restablecerGastoHistorico($event)">
  </app-modal-editar-recurrente>

</ion-content>
