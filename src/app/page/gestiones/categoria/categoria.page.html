<ion-header class="ion-no-border">
    <ion-toolbar>
        <app-banner-top [toolBarData]="toolBar"></app-banner-top>
    </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="content-bg ion-padding">
    
    <!-- Sección de Creación / Edición -->
    <div class="form-section">
        <h2 class="section-title">{{ isUpdate ? 'Editar Categoría' : 'Nueva Categoría' }}</h2>
        
        <div class="input-group">
            <div class="icon-selector" (click)="clickDateModal()">
                <ion-icon [src]="formCat.icon ? getIcon(formCat.icon) : getIcon('add-outline')"></ion-icon>
            </div>
            <div class="input-wrapper">
                <input-simple [label]="''" [name]="formCat.id" [required]="formCat.required" [type]="formCat.tipo" [placeholder]="formCat.placeholder" [(ngModel)]="formCat.valueSelect" (ionInput)="ionChangeInput(formCat)"></input-simple>
            </div>
        </div>

        <div class="action-buttons">
            <ion-button *ngIf="isUpdate" class="button-cancel" fill="clear" (click)="resetData()">Cancelar</ion-button>
            <ion-button class="button-action-main" expand="block" shape="round" (click)="saveNewCategory()" [disabled]="disabledButton">{{tituloBotton}}</ion-button>
        </div>
    </div>

    <!-- Listado de Categorías Existentes -->
    <div class="list-section" *ngIf="listCategoria.length">
        <h2 class="section-title">Categorías Activas</h2>
        
        <div class="categories-grid">
            <div class="category-card" *ngFor="let cat of listCategoria" (click)="onItemCategoria(cat)">
                <div class="cat-icon-container">
                    <ion-icon [src]="getIcon(cat.icono)"></ion-icon>
                </div>
                <span class="cat-name">{{cat.nombre}}</span>
            </div>
        </div>
    </div>

    <empty-base *ngIf="!listCategoria.length" [dataCard]="dataCard"></empty-base>

</ion-content>

<!-- Modal de Selección de Iconos -->
<app-modal-base *ngIf="showPopup" [showPopup]="showPopup" (closePopupClick)="closePopupClick()" [isButtonClsHidden]="false">
    <div class="icon-modal-content">
        <h3 class="modal-title">Elige un ícono</h3>
        <div class="icons-grid">
            <div class="icon-option" *ngFor="let sim of listSim" (click)="onSimbolCLick(sim)">
                <ion-icon [src]="getIcon(sim)"></ion-icon>
            </div>
        </div>
    </div>
</app-modal-base>
