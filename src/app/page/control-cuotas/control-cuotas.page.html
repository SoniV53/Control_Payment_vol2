<ion-header class="ion-no-border">
  <ion-toolbar>
    <app-banner-top [toolBarData]="toolBar" [loader]="loaderNav"></app-banner-top>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <!-- Custom Tabs (sin ion-segment-view que bugea en mobile) -->
  <div class="tab-bar">
    <button class="tab-btn" [class.active]="tabEstado === 'progreso'" (click)="tabEstado = 'progreso'">
      <ion-icon [src]="getIcon('hourglass-outline')" ></ion-icon>
      En Progreso
      <span class="badge" *ngIf="gruposProgreso.length > 0">{{ countItems(gruposProgreso) }}</span>
    </button>
    <button class="tab-btn" [class.active]="tabEstado === 'pagados'" (click)="tabEstado = 'pagados'">
      <ion-icon [src]="getIcon('checkmark-done-outline')" ></ion-icon>
      Pagados
      <span class="badge done" *ngIf="gruposPagados.length > 0">{{ countItems(gruposPagados) }}</span>
    </button>
  </div>

  <!-- ═══════════════════════════════════ EN PROGRESO ═══════════════════════════════════ -->
  <div *ngIf="tabEstado === 'progreso'">

    <app-empty-state 
      *ngIf="gruposProgreso.length === 0" 
      icon="checkmark-done-circle-outline" 
      title="No tienes cuotas en progreso" 
      subtitle="Cuando registres un gasto en cuotas aparecerá aquí.">
    </app-empty-state>

    <app-category-block 
      *ngFor="let g of gruposProgreso" 
      [grupo]="g" 
      estado="progreso"
      (clickItem)="abrirGestionCuotas($event)"
      (editItem)="abrirEditarGasto($event)"
      (deleteItem)="eliminarGasto($event)">
    </app-category-block>
  </div>

  <!-- ═══════════════════════════════════ PAGADOS ═══════════════════════════════════ -->
  <div *ngIf="tabEstado === 'pagados'">

    <app-empty-state 
      *ngIf="gruposPagados.length === 0" 
      icon="checkmark-done-circle-outline" 
      title="No tienes cuotas finalizadas" 
      subtitle="Cuando completes todas las cuotas de un gasto, aparecerá aquí.">
    </app-empty-state>

    <app-category-block 
      *ngFor="let g of gruposPagados" 
      [grupo]="g" 
      estado="pagados"
      (clickItem)="abrirGestionCuotas($event)"
      (editItem)="abrirEditarGasto($event)"
      (deleteItem)="eliminarGasto($event)">
    </app-category-block>
  </div>

  <!-- ═══════════════ Modal Detalle Cuotas ═══════════════ -->
  <app-modal-detalle-cuotas 
    [(isOpen)]="isModalOpen" 
    [gastoSeleccionado]="gastoSeleccionado" 
    [detalleCuotas]="detalleCuotas"
    (confirmarToggle)="manejarConfirmacionToggle($event)">
  </app-modal-detalle-cuotas>

  <!-- ═══════════════ Bottom Sheet Editar ═══════════════ -->
  <ion-modal [isOpen]="isEditModalOpen" (didDismiss)="isEditModalOpen = false" [initialBreakpoint]="0.75" [breakpoints]="[0, 0.75, 1]" class="bottom-sheet" mode="ios">
    <ng-template>
      
      <ion-content class="ion-padding modal-bg">
        <div class="inputs-form form-section">
          <h2 style="color: #ffffff; font-size: 18px; font-weight: 700; margin-top: 0px; margin-bottom: 24px; padding-left: 4px;">Editar Cuota</h2>
          <input-simple label="Ttulo" name="titulo" [(ngModel)]="editData.titulo" placeholder="Ingrese el ttulo"></input-simple>
          <input-simple label="Monto Total (GTQ)" type="number" name="monto" [(ngModel)]="editData.monto" placeholder="0.00"></input-simple>
          <input-simple label="Total de Cuotas" type="number" name="cuotas" [(ngModel)]="editData.cuotas" placeholder="0"></input-simple>
          
          <app-selector-modal 
            label="Categoria" 
            name="categoria"
            [list]="categoriasMapped" 
            [(ngModel)]="editData.categoria_id" 
            placeholder="Selecciona categoria"
            modalTitle="Elegir Categoria"
            actionButtonText="Crear Nueva Categoria"
            (actionButtonClick)="goToNuevaCategoria()">
          </app-selector-modal>

          <ion-button expand="block" class="button-action-main ion-margin-top" shape="round" (click)="guardarEdicion()">
            GUARDAR CAMBIOS
          </ion-button>
        </div>
      </ion-content>
    </ng-template>
  </ion-modal>







</ion-content>
