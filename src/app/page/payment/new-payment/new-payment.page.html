<ion-header class="ion-no-border">
    <ion-toolbar>
        <app-banner-top [toolBarData]="toolBar", [loader]="loaderNav"></app-banner-top>
    </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding content-bg">
    
    <!-- Selector de Tipo de Gasto (Top) -->
    <div class="segment-container">
        <ion-segment [(ngModel)]="valueSegment" (ionChange)="clickSegment(valueSegment)" mode="ios" class="custom-segment">
            <ion-segment-button value="normal">
                <ion-label>Mensual</ion-label>
            </ion-segment-button>
            <ion-segment-button value="cuota">
                <ion-label>En Cuotas</ion-label>
            </ion-segment-button>
        </ion-segment>
    </div>

    <!-- Contenedor del Formulario -->
    <div class="inputs-form">
        <form #f="ngForm">
            <div class="input-wrapper" *ngFor="let form of listaFormulario">
                <div [ngSwitch]="form.tipo">

                    <div *ngSwitchCase="'select'">
                        <selector-simple [defaultSelect]="false"
                            [open]="this.showPopup && tipoModalUse === 'select'"
                            [valueSelect]="form.valueSelect" [icon]="form.icon"
                            (clickItem)="onClickItemAction(form)" [label]="form.titulo" [name]="form.id"
                            [required]="form.required" [placeholder]="form.placeholder"
                            [list]="form?.list || []" [(ngModel)]="form.valueSelect"
                            (ionChange)="ionChangeInput(form)"></selector-simple>
                    </div>
                    <div *ngSwitchCase="'date'">
                        <input-simple (click)="clickDateModal(form)" [label]="form.titulo" [name]="form.id"
                            [required]="form.required" type="date" [placeholder]="form.placeholder"
                            [(ngModel)]="form.valueSelect" (ionBlur)="blurInput(form)"
                            (ionInput)="ionChangeInput(form)" [readonly]="true"></input-simple>
                    </div>

                    <div *ngSwitchDefault>
                        <input-simple [label]="form.titulo" [name]="form.id" [required]="form.required"
                            [type]="form.tipo" [placeholder]="form.placeholder" [(ngModel)]="form.valueSelect"
                            (ionBlur)="blurInput(form)" (ionInput)="ionChangeInput(form)"></input-simple>
                    </div>

                </div>
            </div>
        </form>

        <!-- Toggle Recurrente -->
        <div class="toggle-container" *ngIf="valueSegment === 'normal'">
            <ion-item lines="none" class="recurrente-item">
                <ion-icon name="sync-outline" slot="start" class="recurrente-icon"></ion-icon>
                <ion-label>
                    <h3>Hacer Recurrente</h3>
                    <p>Se repetirá todos los meses</p>
                </ion-label>
                <ion-toggle slot="end" mode="ios" [checked]="isCheck" [(ngModel)]="isCheck" color="success"></ion-toggle>
            </ion-item>
        </div>
    </div>

    <!-- Botón Inferior -->
    <div class="footer-button-container">
        <ion-button class="button-action-main" expand="block" shape="round" size="large" (click)="saveNewPayment()"
            [disabled]="disabledButton">Guardar Gasto</ion-button>
    </div>

</ion-content>

<app-modal-base *ngIf="showPopup" [showPopup]="showPopup" (closePopupClick)="closePopupClick()"
    [isButtonClsHidden]="true" [sheetBottom]="tipoModalUse === 'select'">
    <div *ngIf="tipoModalUse === 'date' && dataSelect">
        <ion-datetime presentation="month-year" doneText="OK" cancelText="Cancelar"
            (ionChange)="onMonthYearChange($event)" class="custom-date" [value]="dataSelect.valueSelect || ''"
            [max]="maxYear">
        </ion-datetime>
    </div>

    <div *ngIf="tipoModalUse === 'select'" class="modal-sheet">
        <br>
        <div *ngFor="let data of dataListaSelect">
            <ion-item class="ion-item" (click)="onClickItem(data)">
                <ion-icon [src]="getIcon(data.icon || '')" class="icon"></ion-icon>
                <ion-label>{{data.value}}</ion-label>
            </ion-item>
        </div>

        <div *ngIf="!dataListaSelect.length">
            <empty-base [dataCard]="dataCard"></empty-base>

            <br>
        </div>
        <ion-button class="button-action-second " expand="block" [routerLink]="['/categoria']">Crear Categoria
        </ion-button>
    </div>



</app-modal-base>
