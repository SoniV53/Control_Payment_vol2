<ion-header class="ion-no-border">
    <ion-toolbar>
        <app-banner-top [toolBarData]="toolBar"></app-banner-top>
    </ion-toolbar>

    <ion-toolbar>
        <ion-segment [(ngModel)]="valueSegment" (ionChange)="clickSegment(valueSegment)">
            <ion-segment-button value="normal">
                <ion-label>Mensual</ion-label>
            </ion-segment-button>
            <ion-segment-button value="cuota">
                <ion-label>Cuota</ion-label>
            </ion-segment-button>
        </ion-segment>
    </ion-toolbar>
</ion-header>


<ion-content [fullscreen]="true">
    <div>
        <div class="inputs-form">
            <div class="inputs-ion">
                <form #f="ngForm">
                    <div class="input" *ngFor="let form of listaFormulario">
                        <div [ngSwitch]="form.tipo">

                            <div *ngSwitchCase="'select'">
                                <selector-simple [label]="form.titulo" [name]="form.id" [required]="form.required" [placeholder]="form.placeholder" [list]="form?.list || []" [(ngModel)]="form.valueSelect" (ionChange)="ionChangeInput(form)"></selector-simple>
                            </div>
                            <div *ngSwitchCase="'date'">
                                <input-simple (click)="clickDateModal(form)" [label]="form.titulo" [name]="form.id" [required]="form.required" type="date" [placeholder]="form.placeholder" [(ngModel)]="form.valueSelect" (ionBlur)="blurInput(form)" (ionInput)="ionChangeInput(form)" [readonly]="true"></input-simple>
                            </div>

                            <div *ngSwitchDefault>
                                <input-simple [label]="form.titulo" [name]="form.id" [required]="form.required" [type]="form.tipo" [placeholder]="form.placeholder" [(ngModel)]="form.valueSelect" (ionBlur)="blurInput(form)" (ionInput)="ionChangeInput(form)"></input-simple>
                            </div>

                        </div>

                    </div>
                </form>


                <div style="margin-top: 24px;">
                    <ion-toggle aria-label="Enable Notifications"></ion-toggle>
                </div>


            </div>


        </div>
    </div>


</ion-content>

<ion-footer class="ion-no-border" *ngIf="!showPopup">
    <div class="footer-button">
        <ion-button class="button-action" expand="block" (click)="saveNewPayment()" [disabled]="disabledButton">Aceptar</ion-button>
    </div>
</ion-footer>

<app-modal-base *ngIf="showPopup && dataSelect" [showPopup]="showPopup" (closePopupClick)="closePopupClick()" [isButtonClsHidden]="false">
    <ion-datetime presentation="month-year" doneText="OK" cancelText="Cancelar" (ionChange)="onMonthYearChange($event)" class="custom-date" [value]="dataSelect.valueSelect || ''" [max]="maxYear">
    </ion-datetime>
</app-modal-base>
