<ion-header class="ion-no-border">
    <ion-toolbar>
        <app-banner-top [toolBarData]="toolBar", [loader]="loaderNav"></app-banner-top>
    </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding content-bg">
    
    <!-- Selector de Tipo de Gasto (Top) -->
    <div class="segment-container">
        <ion-segment [(ngModel)]="valueSegment" (ionChange)="clickSegment(valueSegment)" mode="ios" class="custom-segment">
            <ion-segment-button value="normal">
                <ion-label>Mensual</ion-label>
            </ion-segment-button>
            <ion-segment-button value="cuota">
                <ion-label>En Cuotas</ion-label>
            </ion-segment-button>
        </ion-segment>
    </div>

    <!-- Contenedor del Formulario -->
    <div class="inputs-form">
        <form #f="ngForm">
            <div class="input-wrapper-list" *ngFor="let form of listaFormulario">
                <div [ngSwitch]="form.tipo">

                    <div *ngSwitchCase="'select'">
                        <app-selector-modal 
                            [label]="form.titulo" 
                            [name]="form.id"
                            [required]="form.required" 
                            [placeholder]="form.placeholder"
                            [list]="form?.list || []" 
                            [(ngModel)]="form.valueSelect"
                            (ionChangeInput)="ionChangeInput(form)"
                            modalTitle="Elegir Categoría"
                            actionButtonText="Crear Nueva Categoría"
                            (actionButtonClick)="goToNuevaCategoria()">
                        </app-selector-modal>
                    </div>
                    <div *ngSwitchCase="'date'">
                        <input-simple (click)="clickDateModal(form)" [label]="form.titulo" [name]="form.id"
                            [required]="form.required" type="date" [placeholder]="form.placeholder"
                            [(ngModel)]="form.valueSelect" (ionBlur)="blurInput(form)"
                            (ionInput)="ionChangeInput(form)" [readonly]="true"></input-simple>
                    </div>

                    <div *ngSwitchDefault>
                        <input-simple [label]="form.titulo" [name]="form.id" [required]="form.required"
                            [type]="form.tipo" [placeholder]="form.placeholder" [(ngModel)]="form.valueSelect"
                            (ionBlur)="blurInput(form)" (ionInput)="ionChangeInput(form)"></input-simple>
                    </div>

                </div>
            </div>
        </form>

        <!-- Toggle Recurrente -->
        <div class="toggle-container" *ngIf="valueSegment === 'normal'">
            <ion-item lines="none" class="recurrente-item">
                <ion-icon name="sync-outline" slot="start" class="recurrente-icon"></ion-icon>
                <ion-label>
                    <h3>Hacer Recurrente</h3>
                    <p>Se repetirá todos los meses</p>
                </ion-label>
                <ion-toggle slot="end" mode="ios" [checked]="isCheck" [(ngModel)]="isCheck" color="success"></ion-toggle>
            </ion-item>
        </div>
    </div>

    <!-- Botón Inferior -->
    <div class="footer-button-container">
        <ion-button class="button-action-main" expand="block" shape="round" size="large" (click)="saveNewPayment()"
            [disabled]="disabledButton">Guardar Gasto</ion-button>
    </div>

</ion-content>

<!-- Modal Date Picker -->
<!-- Modal Date Picker Premium -->
<ion-modal [isOpen]="showPopup && tipoModalUse === 'date'" (didDismiss)="closePopupClick()" class="date-modal">
    <ng-template>
        <ion-header class="ion-no-border">
            <ion-toolbar class="modal-toolbar" mode="ios">
                <!-- <ion-buttons slot="start">
                    <ion-button (click)="closePopupClick()" class="btn-cancel-modal">Cancelar</ion-button>
                </ion-buttons> -->
                <ion-title>Elegir Fecha</ion-title>
                    <!-- <ion-buttons slot="end">
                        <ion-button (click)="closePopupClick()" class="btn-save-modal">Guardar</ion-button>
                    </ion-buttons> -->
            </ion-toolbar>
        </ion-header>
        <ion-content class="custom-bg ion-padding">
            <div class="datetime-wrapper">
                <ion-datetime presentation="month-year" mode="ios"
                    (ionChange)="onMonthYearChange($event)" class="custom-date-premium" [value]="dataSelect?.valueSelect || ''"
                    [max]="maxYear">
                </ion-datetime>
            </div>
        </ion-content>
    </ng-template>
</ion-modal>
