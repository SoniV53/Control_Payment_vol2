<ion-content [fullscreen]="true" class="content-bg ion-padding">
    <app-banner-top [toolBarData]="toolBar" (onActionTitle)="onActionTitle()" [loader]="loaderNav"></app-banner-top>

    <div class="metrics-grid">
        <!-- Tarjeta de Presupuesto -->
        <div class="metric-card budget-card" (click)="editarPresupuesto()">
            <div class="metric-header">
                <ion-icon [src]="getIcon('wallet-outline')" ></ion-icon>
                <span>Presupuesto</span>
            </div>
            <div class="metric-value edit-value">
                {{formatearMontoPr(form.valueSelect)}}
                <ion-icon [src]="getIcon('create-outline')"  class="edit-icon"></ion-icon>
            </div>
        </div>

        <div class="metrics-row">
            <!-- Tarjeta Total Gastos -->
            <div class="metric-card small-card">
                <div class="metric-header">
                    <span>Total Gastos</span>
                </div>
                <div class="metric-value warning-value">
                    {{formatearMontoPr(total)}}
                </div>
            </div>

            <!-- Tarjeta Restante -->
            <div class="metric-card small-card">
                <div class="metric-header">
                    <span>Restante</span>
                </div>
                <div class="metric-value success-value">
                    {{formatearMontoPr(restante)}}
                </div>
            </div>
        </div>
        
        <div class="metric-footer">
            <span>Cantidad de Gastos: <strong>{{cantidad}}</strong></span>
        </div>
    </div>

    <div class="listado-gastos">
        <app-payment-category-block *ngFor="let categoria of listCategoria" 
            [categoria]="categoria" 
            [categoriasList]="listCategoria"
            (editGasto)="saveEditGasto($event)" 
            (deleteGasto)="deleteEditGasto($event)" 
            (togglePago)="handleTogglePago($event)"
            (reloadRecurrente)="loadRecurrenteData($event)">
        </app-payment-category-block>
    </div>
</ion-content>


<app-modal-base *ngIf="showPopup && this.myApp.dateSelected" [showPopup]="showPopup"
    (closePopupClick)="closePopupClick()" [isButtonClsHidden]="false" [sheetBottom]="false">
    <div *ngIf="!isEditar">
        <ion-datetime presentation="month-year" doneText="OK" cancelText="Cancelar"
            (ionChange)="onMonthYearChange($event)" class="custom-date" [value]="this.myApp.dateSelected"
            [max]="maxYear || ''">
        </ion-datetime>
    </div>
    <div *ngIf="isEditar" class="input-presupuesto" id="div-presupuesto">
        <input-simple (keyEnter)="blurInput(form); showPopup = false" [id]="form.id" [label]="form.titulo"
            [name]="form.id" [required]="form.required" [type]="form.tipo" [placeholder]="form.placeholder"
            [(ngModel)]="form.valueSelect" (ionBlur)="blurInput(form)" (ionInput)="ionChangeInput(form)"></input-simple>
    </div>

</app-modal-base>
