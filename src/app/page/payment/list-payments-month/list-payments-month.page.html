<ion-header class="ion-no-border header-fixed">
  <app-banner-top [toolBarData]="toolBar" (onActionTitle)="onActionTitle()" [loader]="loaderNav"></app-banner-top>
  <div class="filters-fixed" *ngIf="!isBannerCollapsed">
    <div class="premium-filters-wrapper">
      <div class="filter-top-row" style="flex-direction: column; align-items: stretch;">
        <div class="search-bar-custom" style="width: 100%;">
          <ion-icon [src]="getIcon('search-outline')"></ion-icon>
          <input type="text" placeholder="Buscar pagos..." [(ngModel)]="textoBusqueda" (keyup)="aplicarFiltros()" style="width: 100%;">
        </div>
        
        <div class="filter-selectors-row">
            <div class="category-selector-box compact">
              <ion-icon [src]="getIcon('funnel-outline')"></ion-icon>
              <ion-select [(ngModel)]="categoriaSeleccionada" (ionChange)="aplicarFiltros()" interface="popover" mode="md">
                <ion-select-option value="todas">Categorías</ion-select-option>
                <ion-select-option *ngFor="let cat of listCategoria" [value]="cat.id">{{cat.nombre}}</ion-select-option>
              </ion-select>
            </div>
            <div class="category-selector-box compact">
              <ion-icon [src]="getIcon('checkmark-circle-outline')"></ion-icon>
              <ion-select [(ngModel)]="estadoSeleccionado" (ionChange)="aplicarFiltros()" interface="popover" mode="md">
                <ion-select-option value="todos">Estado</ion-select-option>
                <ion-select-option value="pagados">Pagados</ion-select-option>
                <ion-select-option value="pendientes">Pendientes</ion-select-option>
              </ion-select>
            </div>
        </div>
      </div>

        <app-chips-filter 
        [chips]="chipList" 
        [activeChipId]="tabTipo" 
        (chipChanged)="tabTipo = $event; aplicarFiltros()">
      </app-chips-filter>
    </div>
  </div>
  <button type="button" class="filters-toggle-handle" (click)="isBannerCollapsed = !isBannerCollapsed" [attr.aria-label]="isBannerCollapsed ? 'Mostrar filtros' : 'Ocultar filtros'" [attr.aria-expanded]="!isBannerCollapsed">
    <ion-icon [name]="isBannerCollapsed ? 'chevron-down-outline' : 'chevron-up-outline'"></ion-icon>
    <span>{{ isBannerCollapsed ? 'Mostrar filtros' : 'Ocultar filtros' }}</span>
  </button>
</ion-header>

<ion-content [fullscreen]="true" class="content-bg ion-padding">

    <div class="premium-budget-dashboard" [class.collapsed]="isDashboardCollapsed">
        <!-- Cabecera -->
        <div class="dashboard-header">
            <div class="title-group" (click)="isDashboardCollapsed = !isDashboardCollapsed" style="cursor: pointer;">
                <ion-icon [src]="getIcon('wallet-outline')"></ion-icon>
                <h2>Balance Mensual</h2>
                <ion-icon [name]="isDashboardCollapsed ? 'chevron-down-outline' : 'chevron-up-outline'" class="toggle-icon"></ion-icon>
            </div>
            <button class="edit-budget-btn" (click)="editarPresupuesto()">
                <ion-icon [src]="getIcon('create-outline')"></ion-icon>
                <span *ngIf="!isDashboardCollapsed">Editar</span>
            </button>
        </div>

        <div class="dashboard-body" [class.hide-body]="isDashboardCollapsed">
            <!-- Héroe: Restante -->
            <div class="hero-balance">
                <span class="label">Restante Disponible</span>
                <div class="amount" [ngClass]="{'danger': restante < 0}">
                    {{formatearMontoPr(restante)}}
                </div>
            </div>

            <!-- Barra de Progreso -->
            <div class="progress-section">
                <div class="progress-track">
                    <div class="progress-fill" 
                         [style.width.%]="form.valueSelect > 0 ? (total / form.valueSelect * 100 > 100 ? 100 : total / form.valueSelect * 100) : 0"
                         [ngClass]="{
                            'safe': form.valueSelect > 0 && (total / form.valueSelect) <= 0.7,
                            'warning': form.valueSelect > 0 && (total / form.valueSelect) > 0.7 && (total / form.valueSelect) <= 0.9,
                            'danger': form.valueSelect > 0 && (total / form.valueSelect) > 0.9
                         }">
                    </div>
                </div>
            </div>

            <!-- Footer: Gastos y Presupuesto -->
            <div class="dashboard-footer">
                <div class="stat">
                    <span class="label">Gastos ({{cantidad}})</span>
                    <span class="value" [ngClass]="{'danger-text': total > form.valueSelect}">{{formatearMontoPr(total)}}</span>
                </div>
                <div class="stat text-right">
                    <span class="label">Presupuesto Máximo</span>
                    <span class="value">{{formatearMontoPr(form.valueSelect)}}</span>
                </div>
            </div>
        </div>
    </div>

    <div class="listado-gastos">
        <app-payment-category-block *ngFor="let categoria of listCategoriaFiltro" 
            [categoria]="categoria" 
            [categoriasList]="listCategoria"
            (editGasto)="saveEditGasto($event)" 
            (deleteGasto)="deleteEditGasto($event)" 
            (togglePago)="handleTogglePago($event)"
            (reloadRecurrente)="loadRecurrenteData($event)">
        </app-payment-category-block>
    </div>
</ion-content>


<app-modal-base *ngIf="showPopup && this.myApp.dateSelected" [showPopup]="showPopup"
    (closePopupClick)="closePopupClick()" [isButtonClsHidden]="false" [sheetBottom]="false">
    <div *ngIf="!isEditar">
        <ion-datetime presentation="month-year" doneText="OK" cancelText="Cancelar"
            (ionChange)="onMonthYearChange($event)" class="custom-date" [value]="this.myApp.dateSelected"
            [max]="maxYear || ''">
        </ion-datetime>
    </div>
    <div *ngIf="isEditar" class="input-presupuesto" id="div-presupuesto">
        <h3>Editar Presupuesto</h3>
        <p class="modal-subtitle">Establece tu nuevo límite mensual</p>
        <input-simple (keyEnter)="blurInput(form); showPopup = false" [id]="form.id" [label]="form.titulo"
            [name]="form.id" [required]="form.required" [type]="form.tipo" [placeholder]="form.placeholder"
            [(ngModel)]="form.valueSelect" (ionBlur)="blurInput(form)" (ionInput)="ionChangeInput(form)"></input-simple>
    </div>

</app-modal-base>
