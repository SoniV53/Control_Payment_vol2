<ion-header class="ion-no-border">
  <ion-toolbar>
    <app-banner-top [toolBarData]="toolBar" [loader]="loaderNav"></app-banner-top>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <app-custom-tabs 
    [tabs]="misTabs" 
    [selectedTabId]="tabEstado" 
    (tabSelected)="tabEstado = $event">
  </app-custom-tabs>

  <div [ngSwitch]="tabEstado">

    <!-- RECURRENTES -->
    <div *ngSwitchCase="'recurrente'">
      <app-empty-state 
        *ngIf="gruposRecurrentes.length === 0" 
        icon="folder-open-outline" 
        title="No tienes gastos recurrentes" 
        subtitle="Cuando registres gastos recurrentes aparecerán aquí.">
      </app-empty-state>

      <app-recurrentes-block 
        *ngFor="let grupo of gruposRecurrentes" 
        [grupo]="grupo"
        (toggleActivo)="changeToggleRecurrente($event)"
        (editarRecurrente)="clickItemRecurrente($event)">
      </app-recurrentes-block>
    </div>

    <!-- CUOTAS -->
    <div *ngSwitchCase="'cuota'">
      <app-empty-state 
        *ngIf="gruposProgreso.length === 0" 
        icon="wallet-outline" 
        title="No tienes cuotas en progreso" 
        subtitle="Cuando registres un gasto en cuotas aparecerá aquí.">
      </app-empty-state>

      <app-category-block 
        *ngFor="let g of gruposProgreso" 
        [grupo]="g" 
        estado="progreso"
        (clickItem)="abrirGestionCuotas($event)"
        (editItem)="abrirEditarGastoCuota($event)"
        (deleteItem)="eliminarGastoCuota($event)">
      </app-category-block>
    </div>

  </div>

  <!-- ═══════════════ Modal Detalle Cuotas ═══════════════ -->
  <app-modal-detalle-cuotas 
    [(isOpen)]="isModalOpen" 
    [gastoSeleccionado]="gastoSeleccionado" 
    [detalleCuotas]="detalleCuotas"
    (confirmarToggle)="manejarConfirmacionToggle($event)">
  </app-modal-detalle-cuotas>

  <!-- ═══════════════ Bottom Sheet Editar Cuota ═══════════════ -->
  <app-modal-editar-cuota 
    [(isOpen)]="isEditModalOpen"
    [fields]="listaFormularioEditar"
    (guardar)="guardarEdicionCuota()"
    (formAction)="manejarAccionFormularioEditar($event)">
  </app-modal-editar-cuota>

  <!-- ═══════════════ Modal Editar Recurrente ═══════════════ -->
  <app-modal-editar-recurrente 
    [isOpen]="isModalRecurrenteOpen"
    (closeModal)="isModalRecurrenteOpen = false"
    [editData]="editDataRec"
    [gastosHistoricos]="gastosHistoricos"
    (save)="guardarEdicionRecurrente()"
    (toggleAll)="toggleAllHistorial($event)"
    (editarGasto)="editarGastoHistorico($event)"
    (eliminarGasto)="eliminarGastoHistorico($event)"
    (restablecerGasto)="restablecerGastoHistorico($event)">
  </app-modal-editar-recurrente>

</ion-content>
