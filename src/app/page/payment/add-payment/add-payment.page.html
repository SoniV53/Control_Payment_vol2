<ion-header class="ion-no-border">
  <ion-toolbar>
    <app-banner-top [toolBarData]="toolBar" [loader]="loaderNav"></app-banner-top>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <app-custom-tabs 
    [tabs]="misTabs" 
    [selectedTabId]="tabEstado" 
    (tabSelected)="tabEstado = $event; aplicarFiltros()">
  </app-custom-tabs>

  <div class="premium-filters-wrapper content-filters">
    <div class="filter-top-row">
      <div class="search-bar-custom">
        <ion-icon [src]="getIcon('search-outline')"></ion-icon>
        <input type="text" placeholder="Buscar gastos..." [(ngModel)]="textoBusqueda" (keyup)="aplicarFiltros()">
      </div>
    </div>
    <app-chips-filter 
      [chips]="chipList" 
      [activeChipId]="categoriaSeleccionada" 
      (chipChanged)="categoriaSeleccionada = $event; aplicarFiltros()">
    </app-chips-filter>
  </div>

  <div [ngSwitch]="tabEstado">

    <!-- RECURRENTES -->
    <div *ngSwitchCase="'recurrente'">
      <app-empty-state 
        *ngIf="gruposRecurrentesFiltrados.length === 0" 
        icon="folder-open-outline" 
        [title]="textoBusqueda || categoriaSeleccionada !== 'todas' ? 'No se encontraron resultados' : 'No tienes gastos recurrentes'" 
        [subtitle]="textoBusqueda || categoriaSeleccionada !== 'todas' ? 'Prueba con otro término de búsqueda o categoría.' : 'Cuando registres gastos recurrentes aparecerán aquí.'">
      </app-empty-state>

      <app-recurrentes-block 
        *ngFor="let grupo of gruposRecurrentesFiltrados" 
        [grupo]="grupo"
        (toggleActivo)="changeToggleRecurrente($event)"
        (editarRecurrente)="clickItemRecurrente($event)">
      </app-recurrentes-block>
    </div>

    <!-- CUOTAS -->
    <div *ngSwitchCase="'cuota'">
      <app-empty-state 
        *ngIf="gruposProgresoFiltrados.length === 0" 
        icon="wallet-outline" 
        [title]="textoBusqueda || categoriaSeleccionada !== 'todas' ? 'No se encontraron resultados' : 'No tienes cuotas en progreso'" 
        [subtitle]="textoBusqueda || categoriaSeleccionada !== 'todas' ? 'Prueba con otro término de búsqueda o categoría.' : 'Cuando registres un gasto en cuotas aparecerá aquí.'">
      </app-empty-state>

      <app-category-block 
        *ngFor="let g of gruposProgresoFiltrados" 
        [grupo]="g" 
        estado="progreso"
        (clickItem)="abrirGestionCuotas($event)"
        (editItem)="abrirEditarGastoCuota($event)"
        (deleteItem)="eliminarGastoCuota($event)">
      </app-category-block>
    </div>

  </div>

  <!-- ═══════════════ Modal Detalle Cuotas ═══════════════ -->
  <app-modal-detalle-cuotas 
    [(isOpen)]="isModalOpen" 
    [gastoSeleccionado]="gastoSeleccionado" 
    [detalleCuotas]="detalleCuotas"
    (confirmarToggle)="manejarConfirmacionToggle($event)">
  </app-modal-detalle-cuotas>

  <!-- ═══════════════ Bottom Sheet Editar Cuota ═══════════════ -->
  <app-modal-editar-cuota 
    [(isOpen)]="isEditModalOpen"
    [fields]="listaFormularioEditar"
    [(modoMonto)]="modoMontoCuota"
    (modoMontoChange)="recalcularMontoCuota()"
    (guardar)="guardarEdicionCuota()"
    (formAction)="manejarAccionFormularioEditar($event)"
    (formChange)="onFormChangeCuota($event)">
  </app-modal-editar-cuota>

  <!-- ═══════════════ Modal Editar Recurrente ═══════════════ -->
  <app-modal-editar-recurrente 
    [isOpen]="isModalRecurrenteOpen"
    (closeModal)="isModalRecurrenteOpen = false"
    [editData]="editDataRec"
    [gastosHistoricos]="gastosHistoricos"
    [categorias]="listCategoria"
    (save)="guardarEdicionRecurrente()"
    (toggleAll)="toggleAllHistorial($event)"
    (editarGasto)="editarGastoHistorico($event)"
    (eliminarGasto)="eliminarGastoHistorico($event)"
    (restablecerGasto)="restablecerGastoHistorico($event)">
  </app-modal-editar-recurrente>

</ion-content>
